name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, test and Godot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK pinned in global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build with warnings as errors
        run: dotnet build --no-restore -warnaserror

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Test
        run: dotnet test --no-build

      # Loads game/data through the loader the game uses and fails on any error it reports.
      - name: Check the game data
        run: dotnet run --no-build --project src/Tools -- datacheck game/data

      # Runs the recorded matches in tests/golden/replays again, on the frozen data beside them,
      # and fails when a state hash is not the recorded one: a change has changed what a match
      # does. docs/determinism.md says what to do when the change was meant to.
      - name: Run the golden replays
        run: dotnet run --no-build --project src/Tools -- replay verify tests/golden/replays --data tests/golden/data

      - name: Install the Godot .NET build pinned in global.json
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: global.json
          use-dotnet: true
          include-templates: false

      - name: Import the project and build it from the Godot editor
        run: godot --headless --path game --import --build-solutions

      # The editor rewrites Game.csproj when its Sdk version or target framework drifts from the
      # pinned ones, and creates .uid files for scripts that were committed without one.
      - name: Check that Godot left the working tree unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # The game starts in its main scene, builds a match, plays a fixed script of move orders in
      # it and prints one line about it. Godot exits with 0 even when the C# assembly or a script
      # fails to load, so that line is what proves the game ran. Its content hash must be the one datacheck computes: the game reads the data
      # files through Godot and the tool reads them from disk.
      - name: Run the headless smoke test
        shell: bash
        run: |
          godot --headless --path game --quit-after 600 -- --smoke-test 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          line="$(grep '^SMOKE_TEST_OK' "$RUNNER_TEMP/smoke.log")"
          game_hash="$(sed -n 's/.* content_hash=\([^ ]*\).*/\1/p' <<< "$line")"
          data_hash="$(dotnet run --no-build --project src/Tools -- datacheck game/data | sed -n 's/^ *content hash: //p')"
          echo "The game read the data as $game_hash and datacheck as $data_hash."
          if [ -z "$game_hash" ] || [ "$game_hash" != "$data_hash" ]; then
            echo "::error::The game and datacheck do not agree on the content hash of game/data."
            exit 1
          fi

      # Two copies of the game on this machine, one hosting and one joining over the local
      # address, play a short match with nobody at the keyboard: the guest is sent the match, both
      # give a move order, and the host ends it. Each prints one line with the last tick and the
      # state hash, which must agree, and the replay each wrote must give the same match again.
      # This is the only test of the network as the game wires it.
      - name: Run a network match between two copies of the game
        shell: bash
        run: |
          files="$RUNNER_TEMP/net-test"
          rm -rf "$files"
          mkdir -p "$files/host" "$files/guest"
          godot --headless --path game -- --host 24642 --net-test 200 --match-files "$files/host" > "$files/host.log" 2>&1 &
          host=$!
          # The guest starts once the host listens: a join to a port nobody has open fails at once.
          for _ in $(seq 1 240); do
            if grep -q '^Hosting on port' "$files/host.log" || ! kill -0 "$host" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          godot --headless --path game -- --join 127.0.0.1:24642 --net-test 200 --match-files "$files/guest" > "$files/guest.log" 2>&1 || true
          wait "$host" || true
          cat "$files/host.log" "$files/guest.log"
          host_line="$(grep '^NET_TEST_OK role=host ' "$files/host.log" || true)"
          guest_line="$(grep '^NET_TEST_OK role=guest ' "$files/guest.log" || true)"
          if [ -z "$host_line" ] || [ -z "$guest_line" ]; then
            echo "::error::The two games did not both finish the network match."
            exit 1
          fi
          host_end="$(sed -n 's/.* \(tick=[0-9]* \).*\( dropped=[0-9]*\).*\( state_hash=[0-9a-f]*\).*/\1\2\3/p' <<< "$host_line")"
          guest_end="$(sed -n 's/.* \(tick=[0-9]* \).*\( dropped=[0-9]*\).*\( state_hash=[0-9a-f]*\).*/\1\2\3/p' <<< "$guest_line")"
          echo "The host ended with $host_end and the guest with $guest_end."
          if [ -z "$host_end" ] || [ "$host_end" != "$guest_end" ] || ! grep -q ' dropped=0 ' <<< "$host_line"; then
            echo "::error::The two games do not agree on how the network match ended, or an order was dropped."
            exit 1
          fi
          dotnet run --no-build --project src/Tools -- replay verify "$files/host" "$files/guest" --data game/data

      # The same two copies again, and this time the joining game puts a fault into its own state
      # on purpose: one unit is the smallest step from where it should be. Both games must stop
      # because they no longer agree, say so in the words a player sees, and each write its desync
      # bundle and name it. The desync-diff tool, given the two bundles, must then find the store
      # the fault was put in, say which game did not repeat its own run, and name the field of
      # the unit that was moved, in the first tick that differs. This is the only test of the
      # desync files as the game wires them.
      - name: Run a desync made on purpose between two copies of the game
        shell: bash
        run: |
          files="$RUNNER_TEMP/net-desync"
          rm -rf "$files"
          mkdir -p "$files/host" "$files/guest"
          godot --headless --path game -- --host 24643 --net-test 400 --net-test-desync 30 --match-files "$files/host" > "$files/host.log" 2>&1 &
          host=$!
          for _ in $(seq 1 240); do
            if grep -q '^Hosting on port' "$files/host.log" || ! kill -0 "$host" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          godot --headless --path game -- --join 127.0.0.1:24643 --net-test 400 --net-test-desync 30 --match-files "$files/guest" > "$files/guest.log" 2>&1 || true
          wait "$host" || true
          cat "$files/host.log" "$files/guest.log"
          host_bundle="$(sed -n 's/^NET_TEST_DESYNC role=host .* bundle=//p' "$files/host.log")"
          guest_bundle="$(sed -n 's/^NET_TEST_DESYNC role=guest .* bundle=//p' "$files/guest.log")"
          if [ ! -f "$host_bundle" ] || [ ! -f "$guest_bundle" ]; then
            echo "::error::The two games did not both stop on the desync and write a bundle."
            exit 1
          fi
          for side in host guest; do
            bundle_name="${side}_bundle"
            if ! grep -q "^The match was stopped because the players' games no longer agreed" "$files/$side.log" || ! grep -qxF "${!bundle_name}" "$files/$side.log"; then
              echo "::error::The $side's game did not say in words what happened, or did not name its file."
              exit 1
            fi
          done
          code=0
          dotnet run --no-build --project src/Tools -- desync-diff "$host_bundle" "$guest_bundle" --data game/data > "$files/report.txt" || code=$?
          cat "$files/report.txt"
          if [ "$code" != 1 ]; then
            echo "::error::desync-diff exited with $code. It exits with 1 when it has compared two bundles that differ."
            exit 1
          fi
          for expected in \
            '^First tick that differs: [0-9]+\.' \
            '^First store that differs: bodies\. In that tick 1 of the [0-9]+ parts of the state differ: bodies\.$' \
            "^A's machine ran ticks [0-9]+ to [0-9]+ a second time from the agreed state and got the same states: it repeats itself\.$" \
            "^B's machine ran the match a second time .* in: bodies\. It does not repeat itself\.$" \
            '^This machine agrees with A\.$' \
            '^[0-9]+ differences? after [0-9]+ ticks, the first tick that differs, A \| B:$' \
            '^  bodies entity [0-9]+ +Position\.X: '; do
            if ! grep -Eq "$expected" "$files/report.txt"; then
              echo "::error::The report of desync-diff has no line like: $expected"
              exit 1
            fi
          done
