name: Determinism

# Every machine in a match must compute exactly the same state, so the tests that pin recorded
# values (the random generator's output, the state hash of known input, the final hash of the toy
# match, the bytes of an encoded command and of a snapshot) run on every operating system and
# processor a player can have. So do the golden replays: whole recorded matches, whose state
# hashes must be the recorded ones on every system. They need no Godot: only the .NET SDK.
on:
  push:
    branches:
      - main
  schedule:
    # Nightly, at an odd minute to stay clear of the top of the hour.
    - cron: "23 3 * * *"
  workflow_dispatch:
  # A change to this file or to the build settings every project shares is checked before it
  # merges. So is a change to the network transport: sockets behave differently from one system
  # to the next, and its tests run on real ones. Other pull requests are covered by ci.yml on
  # Linux and by the run on main.
  pull_request:
    paths:
      - .github/workflows/determinism.yml
      - Directory.Build.props
      - global.json
      - src/Net.Udp/**
      - tests/Net.Udp.Tests/**

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. On main every commit keeps
# its own run, so that a failure names the merge that caused it.
concurrency:
  group: determinism-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    name: Tests on ${{ matrix.system.name }}, ${{ matrix.configuration }}
    runs-on: ${{ matrix.system.runner }}
    timeout-minutes: 15
    strategy:
      # One system failing is the finding. The others still have to report.
      fail-fast: false
      matrix:
        system:
          - name: Linux x64
            id: linux-x64
            runner: ubuntu-latest
          - name: Windows x64
            id: windows-x64
            runner: windows-latest
          - name: macOS arm64
            id: macos-arm64
            runner: macos-latest
          - name: macOS x64
            id: macos-x64
            runner: macos-15-intel
        # Debug checks whole-number overflow. Release is optimized, as an exported game is.
        configuration:
          - Debug
          - Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK pinned in global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Show the system and the SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build with warnings as errors
        id: build
        run: dotnet build --no-restore --configuration ${{ matrix.configuration }} -warnaserror

      # Every test project in the solution, so a new one is picked up without a change here.
      - name: Test
        run: dotnet test --no-build --configuration ${{ matrix.configuration }}

      # The recorded matches of tests/golden/replays, run again on the frozen data beside them.
      # The step fails when a state hash is not the recorded one. Its report, one line for each
      # replay with the final state hash, goes to the last job, which compares the systems. It
      # runs when a test has failed too, so that one failing test does not hide whether the
      # systems agree.
      - name: Run the golden replays
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          dotnet run --no-build --configuration ${{ matrix.configuration }} --project src/Tools -- \
            replay verify tests/golden/replays --data tests/golden/data | tee "$RUNNER_TEMP/golden-report.txt"

      - name: Keep the report of the golden replays
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-report-${{ matrix.system.id }}-${{ matrix.configuration }}
          path: ${{ runner.temp }}/golden-report.txt
          if-no-files-found: warn
          # A job that is run again replaces its report.
          overwrite: true
          retention-days: 14

  # Each job above has compared its own run with the hashes in the replay files. This one compares
  # the jobs with each other: every system and configuration must have written the same report,
  # so the same replays with the same final hashes. It fails when a job above failed, because then
  # the systems have not been shown to agree.
  compare:
    name: Golden replays agree on every system
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: golden-report-*
          path: reports

      - name: Compare the reports
        shell: bash
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          failed=0
          count=0
          first=""
          for report in reports/golden-report-*/golden-report.txt; do
            [ -e "$report" ] || continue
            count=$((count + 1))
            # Windows ends lines its own way. Nothing else may differ.
            tr -d '\r' < "$report" > "$report.lf"
            if [ -z "$first" ]; then
              first="$report"
              echo "::group::The report of $(basename "$(dirname "$report")")"
              cat "$report.lf"
              echo "::endgroup::"
            elif diff "$first.lf" "$report.lf"; then
              echo "$(basename "$(dirname "$report")") has the same report."
            else
              echo "::error::The golden replays ran differently: $(basename "$(dirname "$report")") differs from $(basename "$(dirname "$first")")."
              failed=1
            fi
          done

          if [ "$count" -lt 2 ]; then
            echo "::error::Found $count reports of the golden replays, and comparing needs at least 2."
            failed=1
          elif ! grep -Eq '^replay: [0-9]+ replays? reproduced\.$' "$first.lf"; then
            echo "::error::The golden replays did not reproduce."
            failed=1
          fi

          if [ "$TESTS_RESULT" != "success" ]; then
            echo "::error::A job above did not pass (result: $TESTS_RESULT). The $count reports it left were compared, and the systems are not shown to agree until every job passes."
            failed=1
          fi

          exit "$failed"
