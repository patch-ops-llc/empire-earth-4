name: Export

# Builds are workflow artifacts, never GitHub releases: a release is a public download, and the
# project keeps its codename until it has a name of its own.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # A manual run only works once this file is on the default branch, so a pull request that
  # changes the export setup runs it too.
  pull_request:
    paths:
      - .github/workflows/export.yml
      - game/export_presets.cfg
      - Directory.Build.props

permissions:
  contents: read

concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Naming the shell makes a failed command in a pipe fail the step.
defaults:
  run:
    shell: bash

jobs:
  version:
    name: Work out the version that names the builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows-zip: ${{ steps.version.outputs.windows-zip }}
      macos-zip: ${{ steps.version.outputs.macos-zip }}
    steps:
      - id: version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${HEAD_SHA::7}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::'$version' cannot be used in a file name. Use letters, digits, dots, dashes and underscores."
            exit 1
          fi
          {
            echo "windows-zip=Game-windows-x86_64-$version.zip"
            echo "macos-zip=Game-macos-universal-$version.zip"
          } >> "$GITHUB_OUTPUT"

  export-windows:
    name: Export the Windows build, and a Linux build to test
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      data-content-hash: ${{ steps.data.outputs.content-hash }}
      content-hash: ${{ steps.smoke.outputs.content-hash }}
      state-hash: ${{ steps.smoke.outputs.state-hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK pinned in global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install the Godot .NET build pinned in global.json, with export templates
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: global.json
          use-dotnet: true
          include-templates: true

      - name: Import the project
        run: godot --headless --path game --import

      # Godot can exit with 0 after a failed export, so each export must also leave its file behind
      # and must not log an error.
      - name: Export the Linux and Windows builds
        run: |
          mkdir -p "$RUNNER_TEMP/out/linux" "$RUNNER_TEMP/out/windows"
          export_build() {
            echo "::group::Export $1"
            godot --headless --path game --export-release "$1" "$2" 2>&1 | tee "$RUNNER_TEMP/export.log"
            echo "::endgroup::"
            if [ ! -s "$2" ] || grep -q 'ERROR' "$RUNNER_TEMP/export.log"; then
              echo "::error::The $1 export failed."
              exit 1
            fi
          }
          export_build "Linux" "$RUNNER_TEMP/out/linux/Game.x86_64"
          export_build "Windows Desktop" "$RUNNER_TEMP/out/windows/Game.exe"

      # The hash of game/data as the datacheck tool computes it from the files on disk. Every
      # build below must report the same one for the data it carries.
      - name: Compute the content hash of the game data
        id: data
        run: |
          hash="$(dotnet run --project src/Tools -- datacheck game/data | sed -n 's/^ *content hash: //p')"
          echo "datacheck: content hash $hash"
          test -n "$hash"
          echo "content-hash=$hash" >> "$GITHUB_OUTPUT"

      # An exported build refuses a scene path on the command line, so the game runs its smoke test
      # when it is given this argument: it builds a fixed match, prints one line about it and
      # quits. The line reports whether Sim was compiled with optimization, which only the
      # ExportRelease block in Directory.Build.props provides, and two hashes, of the data the
      # build carries and of the match's state. The last job compares them across the builds.
      - name: Run the smoke test in the Linux build
        id: smoke
        run: |
          "$RUNNER_TEMP/out/linux/Game.x86_64" --headless --quit-after 600 -- --smoke-test 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          line="$(grep '^SMOKE_TEST_OK.* sim_optimized=true ' "$RUNNER_TEMP/smoke.log")"
          echo "content-hash=$(sed -n 's/.* content_hash=\([^ ]*\).*/\1/p' <<< "$line")" >> "$GITHUB_OUTPUT"
          echo "state-hash=$(sed -n 's/.* state_hash=\([^ ]*\).*/\1/p' <<< "$line")" >> "$GITHUB_OUTPUT"

      - name: Package the Windows build with the tester notes
        env:
          WINDOWS_ZIP: ${{ needs.version.outputs.windows-zip }}
        run: |
          mkdir "$RUNNER_TEMP/dist"
          cp docs/testers.md "$RUNNER_TEMP/out/windows/HOW-TO-RUN.txt"
          cd "$RUNNER_TEMP/out/windows"
          zip -q -r "$RUNNER_TEMP/dist/$WINDOWS_ZIP" .
          ls -l "$RUNNER_TEMP/dist"

      # archive: false uploads the zip as it is, so the download is not a zip inside a zip. The
      # artifact takes the file's name.
      - name: Upload the Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/dist/${{ needs.version.outputs.windows-zip }}
          archive: false
          if-no-files-found: error

  # The Windows build is made on Linux, so nothing above has started it. This job starts it on
  # Windows. It does not stand in for a tester's machine: the runner has no graphics card, and a
  # file downloaded here skips the SmartScreen check that a browser download gets.
  launch-windows:
    name: Launch the Windows build
    needs: [version, export-windows]
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      content-hash: ${{ steps.smoke.outputs.content-hash }}
      state-hash: ${{ steps.smoke.outputs.state-hash }}
    steps:
      - name: Download the Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.version.outputs.windows-zip }}
          path: download
          skip-decompress: true

      - name: Unpack it
        run: |
          mkdir game
          unzip -q download/*.zip -d game
          ls -l game

      - name: Run the smoke test
        id: smoke
        run: |
          log="$(cygpath -w "$RUNNER_TEMP/smoke.log")"
          ./game/Game.exe --headless --log-file "$log" --quit-after 600 -- --smoke-test
          line="$(tr -d '\r' < "$RUNNER_TEMP/smoke.log" | grep '^SMOKE_TEST_OK.* sim_optimized=true ')"
          echo "$line"
          echo "content-hash=$(sed -n 's/.* content_hash=\([^ ]*\).*/\1/p' <<< "$line")" >> "$GITHUB_OUTPUT"
          echo "state-hash=$(sed -n 's/.* state_hash=\([^ ]*\).*/\1/p' <<< "$line")" >> "$GITHUB_OUTPUT"

      # Without --headless the game opens its window and draws. It must draw 300 frames and then
      # close by itself.
      - name: Run the game in a window
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'window.log'
          $game = Start-Process -FilePath game\Game.exe -ArgumentList '--log-file', $log, '--quit-after', '300' -PassThru
          $null = $game.Handle
          if (-not $game.WaitForExit(180000)) {
            Stop-Process -Id $game.Id -Force
            throw 'The game did not draw 300 frames in three minutes.'
          }
          Get-Content $log
          if ($game.ExitCode -ne 0) { throw "The game exited with code $($game.ExitCode)." }
          if (-not (Select-String -Path $log -Pattern 'Forward Mobile' -Quiet)) { throw 'The log does not name the renderer.' }

      # For a person to look at. Nothing is checked here.
      - name: Take a screenshot of the game
        shell: pwsh
        run: |
          $game = Start-Process -FilePath game\Game.exe -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path $env:RUNNER_TEMP 'launch-windows.png'))
          if (-not $game.HasExited) { Stop-Process -Id $game.Id -Force }

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/launch-windows.png
          archive: false
          if-no-files-found: warn

  # The macOS build is made on macOS so that Apple's codesign signs it. Godot can also export it on
  # Linux, where its built-in signer does the signing, but macOS 26 refuses to start that build:
  # the kernel cannot read the entitlements the signer writes for a .NET project and kills the game
  # as it starts.
  export-macos:
    name: Export and launch the macOS build
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      arm64-content-hash: ${{ steps.smoke-arm64.outputs.content-hash }}
      arm64-state-hash: ${{ steps.smoke-arm64.outputs.state-hash }}
      x86_64-content-hash: ${{ steps.smoke-x86_64.outputs.content-hash }}
      x86_64-state-hash: ${{ steps.smoke-x86_64.outputs.state-hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK pinned in global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install the Godot .NET build pinned in global.json, with export templates
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: global.json
          use-dotnet: true
          include-templates: true

      - name: Import the project
        run: godot --headless --path game --import

      - name: Export the macOS build
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          godot --headless --path game --export-release "macOS" "$RUNNER_TEMP/out/Game.zip" 2>&1 | tee "$RUNNER_TEMP/export.log"
          if [ ! -s "$RUNNER_TEMP/out/Game.zip" ] || grep -q 'ERROR' "$RUNNER_TEMP/export.log"; then
            echo "::error::The macOS export failed."
            exit 1
          fi

      # Godot wrote the zip itself. Adding one file leaves the signed app inside untouched.
      - name: Package the macOS build with the tester notes
        env:
          MACOS_ZIP: ${{ needs.version.outputs.macos-zip }}
        run: |
          mkdir "$RUNNER_TEMP/dist"
          cp docs/testers.md "$RUNNER_TEMP/out/HOW-TO-RUN.txt"
          cd "$RUNNER_TEMP/out"
          zip -q Game.zip HOW-TO-RUN.txt
          mv Game.zip "$RUNNER_TEMP/dist/$MACOS_ZIP"
          ls -l "$RUNNER_TEMP/dist"

      # The tests run the app from the zip, unpacked the way Finder unpacks it. They do not stand in
      # for a tester's machine: a file made here skips the Gatekeeper check that a browser download
      # gets, and the Intel half runs under Rosetta, not on an Intel Mac.
      - name: Unpack the zip
        env:
          MACOS_ZIP: ${{ needs.version.outputs.macos-zip }}
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          ditto -x -k "$RUNNER_TEMP/dist/$MACOS_ZIP" "$RUNNER_TEMP/unpacked"
          ls -l "$RUNNER_TEMP/unpacked"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP"/unpacked/*.app
          codesign --display --verbose=2 "$RUNNER_TEMP"/unpacked/*.app

      - name: Run the smoke test on Apple silicon
        id: smoke-arm64
        run: |
          "$RUNNER_TEMP"/unpacked/*.app/Contents/MacOS/* --headless --log-file "$RUNNER_TEMP/smoke-arm64.log" --quit-after 600 -- --smoke-test
          line="$(grep '^SMOKE_TEST_OK.* sim_optimized=true ' "$RUNNER_TEMP/smoke-arm64.log")"
          echo "content-hash=$(sed -n 's/.* content_hash=\([^ ]*\).*/\1/p' <<< "$line")" >> "$GITHUB_OUTPUT"
          echo "state-hash=$(sed -n 's/.* state_hash=\([^ ]*\).*/\1/p' <<< "$line")" >> "$GITHUB_OUTPUT"

      - name: Run the smoke test as an Intel program
        id: smoke-x86_64
        run: |
          arch -x86_64 "$RUNNER_TEMP"/unpacked/*.app/Contents/MacOS/* --headless --log-file "$RUNNER_TEMP/smoke-x86_64.log" --quit-after 600 -- --smoke-test
          line="$(grep '^SMOKE_TEST_OK.* sim_optimized=true ' "$RUNNER_TEMP/smoke-x86_64.log")"
          echo "content-hash=$(sed -n 's/.* content_hash=\([^ ]*\).*/\1/p' <<< "$line")" >> "$GITHUB_OUTPUT"
          echo "state-hash=$(sed -n 's/.* state_hash=\([^ ]*\).*/\1/p' <<< "$line")" >> "$GITHUB_OUTPUT"

      - name: Upload the macOS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/dist/${{ needs.version.outputs.macos-zip }}
          archive: false
          if-no-files-found: error

      # Without --headless the game opens its window and draws. It must draw 300 frames and then
      # close by itself.
      - name: Run the game in a window
        run: |
          "$RUNNER_TEMP"/unpacked/*.app/Contents/MacOS/* --log-file "$RUNNER_TEMP/window.log" --quit-after 300 &
          game=$!
          for _ in $(seq 1 180); do
            kill -0 "$game" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$game" 2>/dev/null; then
            screencapture -x "$RUNNER_TEMP/launch-macos.png" || true
            kill -9 "$game"
            echo "::error::The game did not draw 300 frames in three minutes."
            exit 1
          fi
          wait "$game"
          cat "$RUNNER_TEMP/window.log"
          grep -q 'Forward Mobile' "$RUNNER_TEMP/window.log"

      # For a person to look at. Nothing is checked here.
      - name: Take a screenshot of the game
        run: |
          "$RUNNER_TEMP"/unpacked/*.app/Contents/MacOS/* &
          game=$!
          sleep 15
          screencapture -x "$RUNNER_TEMP/launch-macos.png" || true
          kill "$game" 2>/dev/null || true

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/launch-macos.png
          archive: false
          if-no-files-found: warn

  # Every build must have read the data that datacheck read, and the same match must have the same
  # state on every system and processor. A difference in the state hash is a determinism failure.
  compare-smoke-tests:
    name: Compare the hashes of the smoke tests
    needs: [export-windows, launch-windows, export-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          DATA_CONTENT_HASH: ${{ needs.export-windows.outputs.data-content-hash }}
          LINUX_CONTENT_HASH: ${{ needs.export-windows.outputs.content-hash }}
          LINUX_STATE_HASH: ${{ needs.export-windows.outputs.state-hash }}
          WINDOWS_CONTENT_HASH: ${{ needs.launch-windows.outputs.content-hash }}
          WINDOWS_STATE_HASH: ${{ needs.launch-windows.outputs.state-hash }}
          MACOS_ARM64_CONTENT_HASH: ${{ needs.export-macos.outputs.arm64-content-hash }}
          MACOS_ARM64_STATE_HASH: ${{ needs.export-macos.outputs.arm64-state-hash }}
          MACOS_X86_64_CONTENT_HASH: ${{ needs.export-macos.outputs.x86_64-content-hash }}
          MACOS_X86_64_STATE_HASH: ${{ needs.export-macos.outputs.x86_64-state-hash }}
        run: |
          failed=0
          compare() {
            echo "$1: content_hash=$2 state_hash=$3"
            if [ -z "$2" ] || [ "$2" != "$DATA_CONTENT_HASH" ]; then
              echo "::error::$1: the build's content hash is not the one datacheck computed, $DATA_CONTENT_HASH."
              failed=1
            fi
            if [ -z "$3" ] || [ "$3" != "$LINUX_STATE_HASH" ]; then
              echo "::error::$1: the state hash differs from the Linux build's, $LINUX_STATE_HASH."
              failed=1
            fi
          }
          echo "datacheck: content hash $DATA_CONTENT_HASH"
          compare "Linux" "$LINUX_CONTENT_HASH" "$LINUX_STATE_HASH"
          compare "Windows" "$WINDOWS_CONTENT_HASH" "$WINDOWS_STATE_HASH"
          compare "macOS on Apple silicon" "$MACOS_ARM64_CONTENT_HASH" "$MACOS_ARM64_STATE_HASH"
          compare "macOS as an Intel program" "$MACOS_X86_64_CONTENT_HASH" "$MACOS_X86_64_STATE_HASH"
          exit "$failed"
